<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F2EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="手帳">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=9">
  <title>手帳</title>
</head>
<body>
  <!-- 画面の中身は app.js が描く(今日 / 週 / 設定) -->
  <main id="view"></main>

  <nav class="tabs" aria-label="画面の切り替え">
    <button data-tab="today">今日</button>
    <button data-tab="week">週</button>
    <button data-tab="settings">設定</button>
  </nav>

  <!-- 下から出てくる小さな操作パネル -->
  <div id="sheet-backdrop" hidden></div>
  <section id="sheet" hidden role="dialog" aria-modal="true"></section>

  <div id="notice" hidden role="status"></div>
  <script src="app.js?v=9"></script>
</body>
</html>
